<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Кот-повар</title>
<meta name="description" content="Игра: гости заказывают блюда, а кот-повар кладёт в кастрюлю ровно то, что просили. Успей, пока гость не проголодался!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='.45' cy='.4' r='.65'><stop offset='0' stop-color='%23f8bb72'/><stop offset='.7' stop-color='%23d27a2a'/><stop offset='1' stop-color='%238a420e'/></radialGradient></defs><path d='M16 46 L20 8 L46 30 Z M84 46 L80 8 L54 30 Z' fill='%23c2661e'/><ellipse cx='50' cy='58' rx='38' ry='32' fill='url(%23g)'/><ellipse cx='37' cy='55' rx='5' ry='6' fill='%23a8b030'/><ellipse cx='63' cy='55' rx='5' ry='6' fill='%23a8b030'/><ellipse cx='37' cy='55' rx='1.4' ry='5' fill='%23140802'/><ellipse cx='63' cy='55' rx='1.4' ry='5' fill='%23140802'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a1f18;
    --ink-2: #6a584a;
    --glass: rgba(255, 250, 243, .64);
    --glass-hi: rgba(255, 255, 255, .7);
    --good: #5b8a50;
    --bad: #b2463a;
    --gold: #b8893a;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --lift: inset 0 1px 0 rgba(255,255,255,.75), 0 12px 28px -14px rgba(60,28,8,.55), 0 2px 6px rgba(60,28,8,.12);
    --wood-size: 520px 180px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background-color: #d6c4ac;
    background-image:
      radial-gradient(85% 42% at 50% -4%, rgba(255, 205, 140, .62), rgba(255, 190, 120, .14) 60%, transparent 80%),
      radial-gradient(140% 95% at 50% 40%, transparent 48%, rgba(44, 24, 10, .55) 100%),
      linear-gradient(180deg, rgba(255, 238, 215, .1), rgba(90, 55, 30, .28)),
      var(--tex-tile);
    background-size: auto, auto, auto, 92px 46px;
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 14px 16px 28px; overflow-x: clip; }
  .screen { display: none; }
  .screen.on { display: block; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  button { font-family: inherit; color: inherit; cursor: pointer; border: none; }
  .glass, .big, .pill, .back, #soundBtn, .bubble, .toast {
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(1.35);
    backdrop-filter: blur(16px) saturate(1.35);
    border: 1px solid var(--glass-hi);
    box-shadow: var(--lift);
  }
  .big {
    display: block; width: 100%; font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: .2px;
    padding: 15px 18px 14px; border-radius: 18px; color: var(--ink);
    margin: 12px 0; transition: transform .12s ease, box-shadow .12s ease, filter .12s;
  }
  .big small { display: block; font-family: var(--sans); font-size: 13.5px; font-weight: 400; opacity: .74; margin-top: 4px; letter-spacing: .1px; }
  .big:active { transform: translateY(1px) scale(.99); filter: brightness(.97); }
  .big.go {
    color: #fff8ef; border-color: rgba(255, 214, 178, .55);
    background:
      linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 48%),
      linear-gradient(135deg, #d48d55, #a9592c 55%, #7c3a16);
    box-shadow: inset 0 1px 0 rgba(255, 232, 205, .7), inset 0 -2px 0 rgba(60, 20, 0, .25), 0 16px 30px -14px rgba(120, 48, 12, .85), 0 2px 6px rgba(60, 28, 8, .25);
    text-shadow: 0 1px 1px rgba(60, 20, 0, .35);
  }
  .big.calm { background: rgba(226, 236, 214, .62); color: #26361f; }
  .pill { padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .back { padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; }

  /* Меню */
  #menu h1 {
    font-family: var(--serif); font-weight: 600; font-size: 50px; line-height: 1.05; text-align: center; margin: 20px 0 0; letter-spacing: .3px;
    color: #2a170c; text-shadow: 0 1px 0 rgba(255, 255, 255, .55), 0 10px 30px rgba(120, 60, 20, .25);
  }
  #menu h1::before, #menu h1::after { content: ""; display: block; height: 1px; width: 132px; margin: 0 auto; background: linear-gradient(90deg, transparent, #a7743c, transparent); }
  #menu h1::before { margin-bottom: 12px; width: 60px; }
  #menu h1::after { margin-top: 12px; }
  .hero { position: relative; display: flex; justify-content: center; align-items: flex-end; gap: 0; margin: 10px 0 8px; padding-bottom: 0; }
  .hero::before { content: ""; position: absolute; left: 50%; top: 6%; width: 300px; height: 210px; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 226, 180, .75), rgba(255, 214, 160, .25) 60%, transparent); pointer-events: none; }
  .hero::after { content: ""; position: absolute; left: 4%; right: 4%; bottom: 0; height: 26px; z-index: 2; border-radius: 3px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 226, 182, .38), rgba(255, 226, 182, .06) 12px, rgba(0, 0, 0, 0) 13px, rgba(20, 10, 4, .3) 14px, rgba(20, 10, 4, .5)), var(--tex-wood);
    background-size: auto, var(--wood-size);
    box-shadow: 0 18px 24px -12px rgba(30, 15, 5, .7), inset 0 1px 0 rgba(255, 232, 196, .45); }
  .hero > div { position: relative; z-index: 1; }
  .hero .cat { animation: bob 2.6s ease-in-out infinite; margin-bottom: 4px; }
  .hero #menuGuest { margin-bottom: 14px; margin-left: -6px; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .lead { text-align: center; font-size: 16px; line-height: 1.55; margin: 16px 6px 10px; color: #4e3e32; text-shadow: 0 1px 0 rgba(255, 250, 240, .8); }
  .lead b { color: var(--ink); font-weight: 600; }
  .record { text-align: center; font-size: 14px; color: var(--ink-2); margin-top: 6px; font-style: italic; font-family: var(--serif); }

  /* Игра */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stats { display: flex; gap: 8px; align-items: center; }
  .hearts { display: flex; gap: 6px; }
  .hearts svg { display: block; filter: drop-shadow(0 2px 2px rgba(80, 10, 10, .2)); }
  #soundBtn { border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink); padding: 0; }

  .order { display: flex; gap: 14px; align-items: flex-start; margin: 12px 0 8px; }
  .guest { width: 104px; flex: none; text-align: center; position: relative; }
  .guest::before { content: ""; position: absolute; left: -8px; right: -8px; top: -4px; height: 104px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 236, 206, .8), rgba(255, 226, 190, .3) 60%, transparent); z-index: -1; }
  .guest svg { display: block; margin: 0 auto; filter: drop-shadow(0 6px 8px rgba(40, 20, 6, .18)); }
  .guest .gname { font-family: var(--serif); font-style: italic; font-size: 13.5px; margin-top: 4px; color: var(--ink); white-space: nowrap; }
  .guest.arrive { animation: arrive .5s cubic-bezier(.2, .8, .3, 1); }
  @keyframes arrive { from { transform: translateX(-60px); opacity: 0; } }
  .guest.leave { animation: leave .4s ease forwards; }
  @keyframes leave { to { transform: translateX(80px); opacity: 0; } }
  .patience { height: 6px; border-radius: 4px; background: rgba(60, 34, 18, .16); overflow: hidden; margin: 6px 6px 0; box-shadow: inset 0 1px 2px rgba(40, 20, 6, .25), 0 1px 0 rgba(255, 255, 255, .5); }
  .patience i { display: block; height: 100%; width: 100%; background: var(--good); border-radius: 4px; transition: width .1s linear, background .3s; position: relative;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(0, 0, 0, .15); }
  .bubble { flex: 1; border-radius: 20px; padding: 12px 14px 10px; position: relative; min-height: 98px; }
  .bubble::before { content: ""; position: absolute; left: -8px; top: 32px; width: 15px; height: 15px; transform: rotate(45deg);
    background: rgba(255, 250, 243, .64); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-left: 1px solid var(--glass-hi); border-bottom: 1px solid var(--glass-hi); clip-path: polygon(0 0, 0 100%, 100% 100%); }
  .bubble .say { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 20px; line-height: 1.2; margin-bottom: 6px; color: #2a170c; }
  .need { display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .need .it { display: flex; align-items: center; font-size: 16px; font-weight: 600; gap: 2px; border-radius: 12px; padding: 1px 7px 1px 3px; transition: background .2s, box-shadow .2s; font-variant-numeric: tabular-nums; }
  .need .it svg { filter: none; }
  .need .it.ok { background: rgba(91, 138, 80, .16); box-shadow: inset 0 0 0 1px rgba(91, 138, 80, .5); color: #2f5a26; }
  .need .it.over { background: rgba(178, 70, 58, .14); box-shadow: inset 0 0 0 1px rgba(178, 70, 58, .5); color: #8a2a20; }
  .need .no { position: relative; width: 40px; height: 40px; }
  .need .ban-lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--bad); margin-right: 3px; }

  .kitchen { position: relative; display: flex; align-items: flex-end; margin-top: 8px; padding-bottom: 20px; }
  .kitchen::before { content: ""; position: absolute; left: 30%; right: 0; bottom: 30px; height: 150px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 214, 150, .45), transparent); pointer-events: none; }
  .kitchen::after { content: ""; position: absolute; left: -16px; right: -16px; bottom: 0; height: 40px; z-index: 1; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(255, 228, 186, .42), rgba(255, 228, 186, .08) 19px, rgba(0, 0, 0, 0) 20px, rgba(255, 220, 170, .25) 21px, rgba(20, 10, 4, .32) 22px, rgba(20, 10, 4, .55)),
      var(--tex-wood);
    background-size: auto, var(--wood-size);
    box-shadow: 0 20px 26px -14px rgba(30, 15, 5, .75); }
  .kitchen .cat { width: 112px; flex: none; margin-right: -16px; margin-bottom: 8px; z-index: 0; position: relative; }
  .kitchen .cat svg { display: block; width: 112px; height: auto; }
  .cat .spoon { transform-origin: 150px 150px; animation: stir .6s ease-in-out infinite alternate; }
  @keyframes stir { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  .pot { position: relative; flex: 1; z-index: 2; }
  .pot .vessel { display: block; }
  .pot .vessel svg { display: block; }
  .contents {
    position: absolute; left: 14%; right: 14%; bottom: 66%;
    display: flex; flex-wrap: wrap-reverse; justify-content: center; align-content: flex-start; gap: 0 2px;
  }
  .contents button { background: none; padding: 0; margin: 0 -3px -10px; animation: drop .3s ease; }
  .contents button svg { display: block; }
  @keyframes drop { from { transform: translateY(-30px) scale(1.3); opacity: 0; } }
  .pot.splash .vessel { animation: shake .35s; }
  @keyframes shake { 25% { transform: rotate(-1.5deg); } 75% { transform: rotate(1.5deg); } }
  .bubbles circle { animation: boil 1.4s ease-in infinite; }
  .bubbles circle:nth-child(2) { animation-delay: .5s; }
  .bubbles circle:nth-child(3) { animation-delay: .9s; }
  @keyframes boil { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-22px); opacity: 0; } }
  .steam path { animation: steam 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .steam path:nth-child(2) { animation-delay: 1.2s; }
  .steam path:nth-child(3) { animation-delay: 2.3s; }
  @keyframes steam { 0% { transform: translateY(8px) scaleY(.7); opacity: 0; } 35% { opacity: 1; } 100% { transform: translateY(-14px) scaleY(1.1); opacity: 0; } }
  .hint { text-align: center; font-size: 13px; font-style: italic; color: var(--ink-2); margin: 8px 0 2px; min-height: 18px; }

  .shelf {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 6px;
    padding: 12px 8px 18px; margin-top: 6px; border-radius: 8px;
    background: linear-gradient(180deg, rgba(255, 232, 196, .22), rgba(255, 232, 196, 0) 30%, rgba(30, 12, 2, .18)), var(--tex-wood);
    background-size: auto, var(--wood-size);
    background-position: 0 0, -120px -40px;
    box-shadow: inset 0 1px 0 rgba(255, 236, 205, .5), inset 0 -7px 0 rgba(40, 18, 4, .38), inset 0 -8px 0 rgba(255, 220, 170, .18), inset 0 0 0 1px rgba(40, 18, 4, .3),
      0 22px 30px -14px rgba(30, 15, 5, .8), 0 3px 6px rgba(30, 15, 5, .25);
  }
  .shelf button {
    background: transparent; border-radius: 12px; padding: 6px 2px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 500; letter-spacing: .03em; color: #fbf1e2; text-shadow: 0 1px 2px rgba(30, 12, 2, .9);
    transition: transform .12s ease, background .2s;
  }
  .shelf button svg { display: block; }
  .shelf button:active { transform: scale(.93); background: rgba(255, 236, 210, .14); }
  .actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .actions .big { margin: 16px 0 0; }
  .big.serve {
    color: #f6fbf0; border-color: rgba(200, 230, 190, .5);
    background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 48%), linear-gradient(135deg, #79a668, #4d7a42 55%, #34592c);
    box-shadow: inset 0 1px 0 rgba(225, 245, 215, .65), inset 0 -2px 0 rgba(10, 30, 5, .25), 0 16px 30px -14px rgba(30, 70, 20, .85), 0 2px 6px rgba(30, 50, 20, .25);
    text-shadow: 0 1px 1px rgba(10, 30, 5, .35);
  }

  .flyer { position: fixed; z-index: 50; pointer-events: none; filter: drop-shadow(0 10px 10px rgba(30, 15, 5, .3)); }

  .toast {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.92);
    background: rgba(255, 250, 243, .78);
    -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
    border-radius: 24px; padding: 22px 22px 20px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 30px 60px -20px rgba(40, 18, 4, .6), 0 4px 14px rgba(40, 18, 4, .15);
    width: min(90vw, 400px); text-align: center; font-size: 18px; z-index: 60;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s cubic-bezier(.2, .8, .3, 1);
  }
  .toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  .toast b { display: block; font-family: var(--serif); font-weight: 600; font-size: 30px; margin-bottom: 8px; }
  .toast b::after { content: ""; display: block; width: 56px; height: 1px; margin: 10px auto 0; background: linear-gradient(90deg, transparent, currentColor, transparent); opacity: .6; }
  .toast.good b { color: var(--good); }
  .toast.bad b { color: var(--bad); }
  .toast .small { font-size: 15px; line-height: 1.55; color: var(--ink); }

  /* Конец */
  #over { text-align: center; }
  #over h2 { font-family: var(--serif); font-weight: 600; font-size: 38px; margin: 26px 0 6px; color: #2a170c; }
  #over h2::after { content: ""; display: block; width: 120px; height: 1px; margin: 12px auto 0; background: linear-gradient(90deg, transparent, #a7743c, transparent); }
  #overCat { display: inline-block; position: relative; padding: 0 56px; margin-top: 4px; background: radial-gradient(closest-side, rgba(255, 226, 180, .7), transparent); }
  #overCat svg { display: block; position: relative; z-index: 0; }
  #overCat::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 24px; z-index: 1; border-radius: 3px;
    background: linear-gradient(180deg, rgba(255, 226, 182, .38), rgba(255, 226, 182, .06) 11px, rgba(0, 0, 0, 0) 12px, rgba(20, 10, 4, .3) 13px, rgba(20, 10, 4, .5)), var(--tex-wood);
    background-size: auto, var(--wood-size); box-shadow: 0 16px 22px -12px rgba(30, 15, 5, .7), inset 0 1px 0 rgba(255, 232, 196, .45); }
  #over .res { font-size: 17px; line-height: 1.8; margin: 10px 0 14px; color: var(--ink-2); }
  #over .res b { font-family: var(--serif); font-size: 22px; color: var(--ink); font-variant-numeric: lining-nums; }
  .rank {
    display: inline-block; padding: 5px 16px; border-radius: 999px; font-family: var(--serif); font-weight: 600; font-size: 16px; color: #3a2608;
    background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 50%), linear-gradient(135deg, #f4dc9a, #c99a42 45%, #f0d488 70%, #b8862e);
    box-shadow: inset 0 1px 0 rgba(255, 250, 220, .8), 0 6px 14px -6px rgba(120, 80, 10, .7);
    text-shadow: 0 1px 0 rgba(255, 240, 200, .6);
  }

  .confetti { position: fixed; top: -20px; width: 9px; height: 13px; z-index: 55; pointer-events: none; border-radius: 1.5px;
    animation: fall 1.4s ease-in forwards; filter: saturate(.8); box-shadow: inset 0 0 0 20px rgba(255, 255, 255, .12), 0 2px 3px rgba(0, 0, 0, .15); }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg) rotateY(720deg); } }
</style>
</head>
<body>
<div class="wrap">

<section class="screen on" id="menu">
  <h1>Кот-повар</h1>
  <div class="hero"><div class="cat" id="menuCat"></div><div id="menuGuest"></div></div>
  <p class="lead">Гости приходят голодные и заказывают блюда. Положи в кастрюлю <b>ровно то, что просят</b> — не больше и не меньше!</p>
  <button class="big go" data-mode="timed">На время<small>Гость ждёт недолго, ошибаться можно 3 раза</small></button>
  <button class="big calm" data-mode="calm">Спокойно<small>Без таймера, ошибки можно исправить</small></button>
  <div class="record" id="record"></div>
</section>

<section class="screen" id="game">
  <div class="topbar">
    <button class="back" id="toMenu">← Меню</button>
    <span class="pill" id="orderNo">Заказ №1</span>
    <div class="stats">
      <span class="pill" id="coins"></span>
      <button id="soundBtn" aria-label="Звук"></button>
    </div>
  </div>
  <div class="hearts" id="hearts" style="justify-content:center;margin-top:8px"></div>

  <div class="order">
    <div class="guest" id="guest"></div>
    <div class="bubble">
      <div class="say" id="say"></div>
      <div class="need" id="need"></div>
    </div>
  </div>

  <div class="kitchen">
    <div class="cat" id="cookCat"></div>
    <div class="pot" id="pot"><div class="vessel" id="vessel"></div><div class="contents" id="contents"></div></div>
  </div>
  <div class="hint" id="hint">Нажимай на продукты на полке</div>

  <div class="shelf" id="shelf"></div>
  <div class="actions">
    <button class="big" id="pourBtn">Вылить</button>
    <button class="big serve" id="serveBtn">Подать!</button>
  </div>
</section>

<section class="screen" id="over">
  <h2>Смена окончена!</h2>
  <div id="overCat"></div>
  <div class="res" id="overRes"></div>
  <button class="big go" id="againBtn">Ещё смену</button>
  <button class="big" id="overMenu">В меню</button>
</section>

</div>
<div class="toast" id="toast"></div>

<script src="art.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rnd(a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const RANKS = ['Поварёнок', 'Помощник повара', 'Повар', 'Шеф-повар', 'Главный шеф', 'Кот-легенда'];
const rankOf = (served) => RANKS[Math.min(RANKS.length - 1, Math.floor(served / 5))];

// ---------- Звук (короткие пиканья, без файлов) ----------
let actx = null, soundOn = store.get('catchef.sound', true);
function tone(freq, dur, type = 'sine', delay = 0, vol = 0.15) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  plop() { tone(320, .12, 'sine'); tone(620, .1, 'sine', .05, .1); },
  out() { tone(500, .1, 'triangle'); tone(260, .12, 'triangle', .06, .1); },
  pour() { for (let i = 0; i < 5; i++) tone(700 - i * 90, .1, 'triangle', i * .05, .08); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, 'triangle', i * .09)); },
  fail() { tone(220, .25, 'sawtooth', 0, .08); tone(165, .35, 'sawtooth', .18, .08); },
  tick() { tone(900, .05, 'square', 0, .04); },
};
function drawSound() { $('soundBtn').innerHTML = ICON.sound(soundOn); }
$('soundBtn').onclick = () => { soundOn = !soundOn; store.set('catchef.sound', soundOn); drawSound(); };

// ---------- Экраны ----------
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function drawMenu() {
  $('menuCat').innerHTML = catSvg('happy', 150);
  $('menuGuest').innerHTML = guestSvg(pick(GUESTS), 'happy', 100);
  const best = store.get('catchef.best', 0);
  $('record').innerHTML = best ? `Рекорд «На время»: ${best} заказов · звание «${rankOf(best)}»` : '';
  show('menu');
}

// ---------- Игра ----------
let S = null; // состояние смены
let timer = null;

function startShift(mode) {
  S = { mode, n: 0, coins: 0, hearts: 3, served: 0, lastGuest: null };
  drawSound();
  show('game');
  nextOrder();
}

function makeOrder(n) {
  const fruit = n > 1 && Math.random() < 0.3;
  const pool = Object.keys(FOOD).filter(id => FOOD[id].kind === (fruit ? 'fruit' : 'veg'));
  const types = Math.min(1 + Math.ceil(n / 2), fruit ? 4 : 5);
  const maxQ = n < 3 ? 1 : n < 6 ? 2 : 3;
  const chosen = shuffle(pool).slice(0, types);
  const need = {};
  chosen.forEach(id => need[id] = 1 + rnd(maxQ));
  let dish, bowl = false;
  if (fruit) { dish = pick(['компот', 'фруктовый салат', 'варенье']); bowl = dish === 'фруктовый салат'; }
  else if (need.beet) dish = 'борщ';
  else { dish = pick(['суп', 'салат', 'рагу', 'щи']); bowl = dish === 'салат'; }
  const others = shuffle(Object.keys(FOOD).filter(id => !need[id]));
  let ban = null;
  if (n >= 4 && Math.random() < 0.6) ban = others.shift();
  const shelfSize = Math.min(4 + Math.floor(n / 2), 12);
  const shelf = Object.keys(need);
  if (ban) shelf.push(ban);
  while (shelf.length < shelfSize && others.length) shelf.push(others.shift());
  const total = Object.values(need).reduce((a, b) => a + b, 0);
  const time = Math.max(12, 30 - n) + total * 1.5;
  let g; do { g = pick(GUESTS); } while (g === S.lastGuest);
  S.lastGuest = g;
  return { need, ban, dish, bowl, shelf: shuffle(shelf), time, guest: g };
}

function nextOrder() {
  S.n++;
  S.order = makeOrder(S.n);
  S.pot = [];
  S.left = S.order.time;
  S.busy = false;
  const o = S.order;
  $('orderNo').textContent = `Заказ №${S.n}`;
  $('say').textContent = `${o.bowl ? 'Приготовь' : 'Свари'} мне ${o.dish}!`;
  $('vessel').innerHTML = o.bowl ? bowlSvg() : potSvg(o.dish === 'борщ' ? '#d0405f' : o.dish === 'компот' || o.dish === 'варенье' ? '#f08aa0' : '#f6c35b');
  $('contents').style.bottom = o.bowl ? '60%' : '66%';
  $('cookCat').innerHTML = catSvg('cook', 96);
  $('shelf').innerHTML = '';
  o.shelf.forEach(id => {
    const b = document.createElement('button');
    b.innerHTML = foodSvg(id, 52) + `<span>${FOOD[id].name}</span>`;
    b.onclick = () => addFood(id, b);
    $('shelf').appendChild(b);
  });
  $('hint').textContent = S.n === 1 ? 'Нажимай на продукты на полке' : '';
  drawGuest('calm', true);
  drawNeed(); drawPot(); drawStats();
  clearInterval(timer);
  if (S.mode === 'timed') {
    $('guest').querySelector('.patience').style.display = '';
    timer = setInterval(tickTime, 100);
  }
}

function drawGuest(mood, arrive) {
  const g = S.order.guest, el = $('guest');
  const bar = S.mode === 'timed' ? `<div class="patience"><i></i></div>` : '';
  el.innerHTML = guestSvg(g, mood, 104) + `<div class="gname">${g.name}</div>` + bar;
  el.classList.remove('arrive', 'leave');
  if (arrive) { void el.offsetWidth; el.classList.add('arrive'); }
  S.mood = mood;
  updateBar();
}
function updateBar() {
  const i = $('guest').querySelector('.patience i');
  if (!i) return;
  const k = Math.max(0, S.left / S.order.time);
  i.style.width = (k * 100) + '%';
  i.style.background = k > .5 ? 'var(--good)' : k > .25 ? '#f0b429' : 'var(--bad)';
}
function tickTime() {
  if (S.busy) return;
  S.left -= 0.1;
  const k = S.left / S.order.time;
  const mood = k > .5 ? 'calm' : k > .25 ? 'worried' : 'angry';
  if (mood !== S.mood) drawGuest(mood);
  else updateBar();
  if (k < .25 && Math.round(S.left * 10) % 10 === 0) sfx.tick();
  if (S.left <= 0) {
    clearInterval(timer);
    failOrder('Гость ушёл голодным!', 'Не успели приготовить вовремя.');
  }
}

function counts() { const c = {}; S.pot.forEach(id => c[id] = (c[id] || 0) + 1); return c; }

function drawNeed() {
  const o = S.order, c = counts();
  let h = Object.entries(o.need).map(([id, q]) => {
    const have = c[id] || 0;
    const cls = have === q ? 'ok' : have > q ? 'over' : '';
    return `<span class="it ${cls}">${foodSvg(id, 38)}×${q}</span>`;
  }).join('');
  if (o.ban) h += `<span class="it ${c[o.ban] ? 'over' : ''}"><span class="ban-lbl">без</span><span class="no">${foodSvg(o.ban, 40)}${ICON.ban}</span></span>`;
  $('need').innerHTML = h;
}
function drawPot() {
  const box = $('contents');
  box.innerHTML = '';
  const size = S.pot.length > 10 ? 30 : 38;
  S.pot.forEach((id, idx) => {
    const b = document.createElement('button');
    b.innerHTML = foodSvg(id, size);
    b.style.animation = idx === S.pot.length - 1 && S.justAdded ? '' : 'none';
    b.onclick = () => { if (S.busy) return; S.pot.splice(idx, 1); S.justAdded = false; sfx.out(); drawPot(); drawNeed(); };
    box.appendChild(b);
  });
  S.justAdded = false;
}
function drawStats() {
  $('coins').innerHTML = ICON.coin() + ' ' + S.coins;
  $('hearts').innerHTML = S.mode === 'timed' ? [0, 1, 2].map(i => ICON.heart(i < S.hearts)).join('') : '';
  $('hearts').style.display = S.mode === 'timed' ? 'flex' : 'none';
}

function addFood(id, btn) {
  if (S.busy) return;
  if (S.pot.length >= 16) { $('hint').textContent = 'Кастрюля полная!'; return; }
  sfx.plop();
  // летящий продукт
  const from = btn.getBoundingClientRect(), to = $('pot').getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'flyer'; f.innerHTML = foodSvg(id, 52);
  f.style.left = from.left + from.width / 2 - 26 + 'px'; f.style.top = from.top + 4 + 'px';
  document.body.appendChild(f);
  const dx = to.left + to.width / 2 - (from.left + from.width / 2), dy = to.top + 20 - from.top;
  const anim = f.animate([
    { transform: 'translate(0,0) scale(1)' },
    { transform: `translate(${dx / 2}px, ${dy - 60}px) scale(1.1) rotate(90deg)`, offset: .5 },
    { transform: `translate(${dx}px, ${dy}px) scale(.6) rotate(200deg)` },
  ], { duration: 380, easing: 'ease-in' });
  anim.onfinish = () => f.remove();
  setTimeout(() => {
    S.pot.push(id); S.justAdded = true;
    $('pot').classList.remove('splash'); void $('pot').offsetWidth; $('pot').classList.add('splash');
    drawPot(); drawNeed();
    if (S.n === 1 && S.pot.length === 1) $('hint').textContent = 'Лишнее? Нажми на продукт в кастрюле — кот его достанет';
  }, 300);
}

$('pourBtn').onclick = () => {
  if (S.busy || !S.pot.length) return;
  sfx.pour(); S.pot = []; drawPot(); drawNeed();
};

function listText(obj) { return Object.entries(obj).map(([id, q]) => `${FOOD[id].name} ×${q}`).join(', '); }

$('serveBtn').onclick = () => {
  if (S.busy) return;
  if (!S.pot.length) { $('hint').textContent = 'Кастрюля пустая — сначала положи продукты'; return; }
  const c = counts(), o = S.order, missing = {}, extra = {};
  for (const [id, q] of Object.entries(o.need)) if ((c[id] || 0) < q) missing[id] = q - (c[id] || 0);
  for (const [id, q] of Object.entries(c)) if (q > (o.need[id] || 0)) extra[id] = q - (o.need[id] || 0);
  let why = '';
  if (Object.keys(missing).length) why += `Не хватает: ${listText(missing)}.<br>`;
  if (Object.keys(extra).length) why += `Лишнее: ${listText(extra)}.`;
  if (o.ban && c[o.ban]) why = `Я же просил без продукта «${FOOD[o.ban].name}»!<br>` + why;
  if (!why) winOrder();
  else if (S.mode === 'calm') {
    sfx.fail(); drawGuest('worried');
    toast('bad', 'Не совсем то…', why + '<br>Исправь и подай ещё раз!', 2600);
  } else failOrder('Не то блюдо!', why);
};

function winOrder() {
  S.busy = true; clearInterval(timer);
  const types = Object.keys(S.order.need).length;
  const bonus = S.mode === 'timed' ? Math.ceil(S.left / 2) : 0;
  const gain = 10 + types * 2 + bonus;
  const oldRank = rankOf(S.served);
  S.coins += gain; S.served++;
  sfx.win(); confetti();
  drawGuest('happy'); $('cookCat').innerHTML = catSvg('happy', 96); drawStats();
  const newRank = rankOf(S.served);
  const rankMsg = newRank !== oldRank ? `<br><span class="rank">Новое звание: ${newRank}!</span>` : '';
  toast('good', 'Вкуснятина!', `${ICON.coin()} +${gain}${bonus ? ` (из них ${bonus} — за скорость)` : ''}${rankMsg}`, rankMsg ? 2200 : 1400, leaveAndNext);
}

function failOrder(title, why) {
  S.busy = true; clearInterval(timer);
  S.hearts--;
  sfx.fail();
  drawGuest('angry'); $('cookCat').innerHTML = catSvg('sad', 96); drawStats();
  toast('bad', title, why, 2400, () => { if (S.hearts <= 0) gameOver(); else leaveAndNext(); });
}

function leaveAndNext() {
  $('guest').classList.add('leave');
  setTimeout(nextOrder, 380);
}

function gameOver() {
  const best = store.get('catchef.best', 0), isBest = S.served > best;
  if (isBest) store.set('catchef.best', S.served);
  $('overCat').innerHTML = catSvg(S.served ? 'happy' : 'sad', 160);
  $('overRes').innerHTML = `Накормлено гостей: <b>${S.served}</b><br>${ICON.coin(26)} Монет: <b>${S.coins}</b><br>
    <span class="rank">${rankOf(S.served)}</span>${isBest && S.served ? '<br>Новый рекорд!' : ''}`;
  show('over');
  if (isBest && S.served) confetti();
}

let toastTimer = null;
function toast(kind, title, text, ms, then) {
  const t = $('toast');
  t.className = 'toast on ' + kind;
  t.innerHTML = `<b>${title}</b><div class="small">${text}</div>`;
  clearTimeout(toastTimer);
  const close = () => { clearTimeout(toastTimer); t.className = 'toast'; t.onclick = null; if (then) { const f = then; then = null; f(); } };
  t.onclick = close;
  toastTimer = setTimeout(close, ms);
}

function confetti() {
  const colors = ['#ff7a59', '#ffc83d', '#3fae5a', '#4d9de0', '#c86bd6'];
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = pick(colors);
    d.style.animationDelay = Math.random() * .4 + 's';
    d.style.animationDuration = 1 + Math.random() * .8 + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2400);
  }
}

// ---------- Кнопки ----------
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => startShift(b.dataset.mode));
$('toMenu').onclick = () => {
  clearInterval(timer);
  if (S && S.mode === 'timed' && S.served) gameOver(); else drawMenu();
};
$('againBtn').onclick = () => startShift(S.mode);
$('overMenu').onclick = drawMenu;

drawMenu();
</script>
</body>
